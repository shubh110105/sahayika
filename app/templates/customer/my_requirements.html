
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaidMate - My Requirements</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand"
           href="{{ url_for('dashboard.customer_dashboard') }}">
            MaidMate
        </a>
        <span class="text-white">My Requirements</span>
    </div>
</nav>

<div class="container py-5">
    <div class="d-flex flex-wrap justify-content-between
                align-items-center mb-4 gap-3">
        <div>
            <h2>My Requirements</h2>
            <p class="text-muted mb-0">
                View your household requirements and their current status.
            </p>
        </div>

        <a href="{{ url_for('requirement.requirement_page') }}"
           class="btn btn-primary">
            + Create Requirement
        </a>
    </div>

    <div id="requirementsMessage"
         class="alert d-none"
         role="alert"></div>

    <div id="requirementsContainer">
        <div class="text-muted">Loading your requirements...</div>
    </div>

    <a href="{{ url_for('dashboard.customer_dashboard') }}"
       class="btn btn-outline-secondary mt-4">
        Back to Dashboard
    </a>
</div>

<script src="{{ url_for('static', filename='js/my_requirements.js') }}"></script>
</body>
</html>
