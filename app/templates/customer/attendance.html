
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Review | MaidMate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #263238;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            color: #607080;
        }

        .attendance-card {
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin: 18px 0;
        }

        .detail-label {
            display: block;
            font-size: 13px;
            color: #687785;
            margin-bottom: 6px;
        }

        .detail-value {
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #fff3cd;
            color: #795900;
            font-size: 12px;
            font-weight: bold;
        }

        .status.confirmed {
            background: #d4edda;
            color: #155724;
        }

        .status.disputed {
            background: #f8d7da;
            color: #721c24;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            margin: 6px 6px 0 0;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .confirm-button {
            background: #198754;
            color: white;
        }

        .dispute-button {
            background: #dc3545;
            color: white;
        }

        .submit-dispute {
            background: #343a40;
            color: white;
        }

        .reason-field {
            width: 100%;
            min-height: 90px;
            padding: 10px;
            margin-top: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font: inherit;
            resize: vertical;
        }

        .message {
            margin: 12px 0;
            font-weight: bold;
        }

        .empty-state {
            background: white;
            padding: 24px;
            border-radius: 10px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #1769aa;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 14px;
            }

            .attendance-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <a class="back-link" href="/customer/dashboard">
            &larr; Back to Dashboard
        </a>

        <header class="header">
            <h1>Attendance Review</h1>
            <p>Review your maid's attendance and confirm or report discrepancies.</p>
        </header>

        <div id="page-message" class="message" role="status"></div>
        <section id="attendance-list" aria-live="polite">
            Loading attendance records...
        </section>
    </main>

    <script>
        const attendanceList = document.getElementById("attendance-list");
        const pageMessage = document.getElementById("page-message");

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, function (char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char];
            });
        }

        function formatDate(value) {
            if (!value) return "—";

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) return "—";

            return date.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric",
                timeZone: "UTC"
            });
        }

        function formatTime(value) {
            if (!value) return "Not recorded";

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) return "—";

            return date.toLocaleTimeString("en-IN", {
                hour: "2-digit",
                minute: "2-digit",
                hour12: true,
                timeZone: "UTC"
            });
        }

        function statusClass(status) {
            if (status === "CONFIRMED") return "confirmed";
            if (status === "DISPUTED") return "disputed";
            return "";
        }

        async function loadAttendance() {
            try {
                const response = await fetch("/customer/attendance");
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Could not load attendance.");
                }

                renderAttendance(data.attendance || []);
            } catch (error) {
                attendanceList.textContent = error.message;
            }
        }

        function renderAttendance(records) {
            if (records.length === 0) {
                attendanceList.innerHTML =
                    '<div class="empty-state">No attendance records found.</div>';
                return;
            }

            attendanceList.innerHTML = records.map(function (record) {
                const pending =
                    record.customer_confirmation === "PENDING";

                const complete =
                    record.check_in && record.check_out;

                return `
                    <article class="attendance-card">
                        <h2>Attendance #${Number(record.attendance_id)}</h2>
                        <p><strong>Maid:</strong> ${escapeHtml(record.maid_name)}</p>

                        <div class="details">
                            <div>
                                <span class="detail-label">Date</span>
                                <span class="detail-value">
                                    ${escapeHtml(formatDate(record.attendance_date))}
                                </span>
                            </div>

                            <div>
                                <span class="detail-label">Check-in</span>
                                <span class="detail-value">
                                    ${escapeHtml(formatTime(record.check_in))}
                                </span>
                            </div>

                            <div>
                                <span class="detail-label">Check-out</span>
                                <span class="detail-value">
                                    ${escapeHtml(formatTime(record.check_out))}
                                </span>
                            </div>

                            <div>
                                <span class="detail-label">Attendance status</span>
                                <span class="status ${statusClass(record.attendance_status)}">
                                    ${escapeHtml(record.attendance_status)}
                                </span>
                            </div>

                            <div>
                                <span class="detail-label">Your confirmation</span>
                                <span class="status ${statusClass(record.customer_confirmation)}">
                                    ${escapeHtml(record.customer_confirmation)}
                                </span>
                            </div>
                        </div>

                        ${pending && complete ? `
                            <div class="review-actions">
                                <button
                                    class="confirm-button"
                                    onclick="reviewAttendance(${Number(record.attendance_id)}, 'CONFIRMED', this)">
                                    Confirm Attendance
                                </button>

                                <button
                                    class="dispute-button"
                                    onclick="showDisputeForm(${Number(record.attendance_id)})">
                                    Dispute Attendance
                                </button>

                                <div id="dispute-${Number(record.attendance_id)}"
                                     hidden>
                                    <label for="reason-${Number(record.attendance_id)}">
                                        Explain the discrepancy
                                    </label>

                                    <textarea
                                        id="reason-${Number(record.attendance_id)}"
                                        class="reason-field"
                                        maxlength="2000"
                                        placeholder="Describe what is incorrect about this attendance record."></textarea>

                                    <button
                                        class="submit-dispute"
                                        onclick="submitDispute(${Number(record.attendance_id)}, this)">
                                        Submit Dispute
                                    </button>
                                </div>
                            </div>
                        ` : ""}
                    </article>
                `;
            }).join("");
        }

        async function reviewAttendance(attendanceId, decision, button) {
            if (decision === "CONFIRMED" &&
                !confirm("Confirm that this attendance record is correct?")) {
                return;
            }

            button.disabled = true;
            pageMessage.textContent = "";

            try {
                const response = await fetch(
                    `/customer/attendance/${attendanceId}/review`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ decision: decision })
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Review failed.");
                }

                pageMessage.textContent = data.message;
                await loadAttendance();
            } catch (error) {
                pageMessage.textContent = error.message;
                button.disabled = false;
            }
        }

        function showDisputeForm(attendanceId) {
            const form = document.getElementById(`dispute-${attendanceId}`);
            form.hidden = false;
        }

        async function submitDispute(attendanceId, button) {
            const reasonField = document.getElementById(`reason-${attendanceId}`);
            const reason = reasonField.value.trim();

            if (!reason) {
                pageMessage.textContent = "Please enter a reason for the dispute.";
                reasonField.focus();
                return;
            }

            button.disabled = true;
            pageMessage.textContent = "";

            try {
                const response = await fetch(
                    `/customer/attendance/${attendanceId}/review`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            decision: "DISPUTED",
                            reason: reason
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Could not submit dispute.");
                }

                pageMessage.textContent = data.message;
                await loadAttendance();
            } catch (error) {
                pageMessage.textContent = error.message;
                button.disabled = false;
            }
        }

        loadAttendance();
    </script>
</body>
</html>
