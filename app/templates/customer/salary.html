
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Salary History</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Salary History</h2>
            <p class="text-muted mb-0">
                View finalized monthly salary records and payment details.
            </p>
        </div>

        <a href="/customer/dashboard" class="btn btn-outline-secondary">
            Back to Dashboard
        </a>
    </div>

    <div id="message" class="alert d-none"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Month</th>
                            <th>Base Salary</th>
                            <th>Attendance Adjustment</th>
                            <th>Leave Adjustment</th>
                            <th>Other Adjustment</th>
                            <th>Final Salary</th>
                            <th>Payment Status</th>
                            <th>Payment Date</th>
                            <th>Remarks</th>
                        </tr>
                    </thead>

                    <tbody id="salaryTableBody">
                        <tr>
                            <td colspan="9" class="text-center">
                                Loading salary records...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
function formatCurrency(value) {
    const amount = Number(value || 0);

    return amount.toLocaleString("en-IN", {
        style: "currency",
        currency: "INR",
        minimumFractionDigits: 2
    });
}

function formatMonth(value) {
    if (!value) return "—";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleDateString("en-IN", {
        month: "long",
        year: "numeric",
        timeZone: "UTC"
    });
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function loadSalaryRecords() {
    const tableBody = document.getElementById("salaryTableBody");
    const message = document.getElementById("message");

    try {
        const response = await fetch("/customer/salary");
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Unable to load salary records."
            );
        }

        const records = data.salary_records || [];

        if (records.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center text-muted">
                        No finalized salary records are available yet.
                    </td>
                </tr>
            `;
            return;
        }

        tableBody.innerHTML = records.map(record => `
            <tr>
                <td>${escapeHtml(formatMonth(record.salary_month))}</td>
                <td>${formatCurrency(record.base_salary)}</td>
                <td>${formatCurrency(record.attendance_adjustment)}</td>
                <td>${formatCurrency(record.leave_adjustment)}</td>
                <td>${formatCurrency(record.other_adjustment)}</td>
                <td class="fw-bold">${formatCurrency(record.final_salary)}</td>
                <td>${escapeHtml(record.payment_status || "NOT RECORDED")}</td>
                <td>${escapeHtml(record.payment_date || "—")}</td>
                <td>${escapeHtml(record.payment_remarks || "—")}</td>
            </tr>
        `).join("");

    } catch (error) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="9" class="text-center text-danger">
                    Failed to load salary records.
                </td>
            </tr>
        `;

        message.textContent = error.message;
        message.className = "alert alert-danger";
    }
}

loadSalaryRecords();
</script>

</body>
</html>
