<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaidMate - Customer Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/customer/dashboard">
            MaidMate
        </a>

        <span class="text-white">
            Customer Profile
        </span>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        My Profile
                    </h2>

                    <div id="message"></div>

                    <div class="mb-4">

                        <h5>Account Information</h5>

                        <p>
                            <strong>Name:</strong>
                            <span id="fullName">Loading...</span>
                        </p>

                        <p>
                            <strong>Email:</strong>
                            <span id="email">Loading...</span>
                        </p>

                        <p>
                            <strong>Phone:</strong>
                            <span id="phone">Loading...</span>
                        </p>

                    </div>

                    <hr>

                    <h5 class="mb-3">
                        Household Information
                    </h5>

                    <form id="profileForm">

                        <!-- Address -->
                        <div class="mb-3">

                            <label
                                for="address"
                                class="form-label"
                            >
                                Address
                            </label>

                            <textarea
                                class="form-control"
                                id="address"
                                rows="3"
                                required
                            ></textarea>

                        </div>

                        <!-- City -->
                        <div class="mb-3">

                            <label
                                for="city"
                                class="form-label"
                            >
                                City
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="city"
                                required
                            >

                        </div>

                        <!-- State -->
                        <div class="mb-3">

                            <label
                                for="state"
                                class="form-label"
                            >
                                State
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="state"
                                required
                            >

                        </div>

                        <!-- Pincode -->
                        <div class="mb-3">

                            <label
                                for="pincode"
                                class="form-label"
                            >
                                Pincode
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="pincode"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Save Profile
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/customer_profile.js') }}"></script>

</body>

</html>
