
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaidMate - Attendance Disputes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/customer/dashboard">MaidMate</a>
        <span class="text-white">Attendance Disputes</span>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>My Attendance Disputes</h2>
        <a href="/customer/attendance/page" class="btn btn-outline-primary">
            Back to Attendance
        </a>
    </div>

    <p class="text-muted">
        Track your reported attendance discrepancies and review responses
        and decisions.
    </p>

    <div id="pageMessage" class="alert d-none"></div>
    <div id="disputeList" class="row g-3"></div>

    <button id="refreshButton" class="btn btn-primary mt-3" type="button">
        Refresh Disputes
    </button>
</div>

<script>
const disputeList = document.getElementById("disputeList");
const pageMessage = document.getElementById("pageMessage");

function showMessage(message, type) {
    pageMessage.className = `alert alert-${type}`;
    pageMessage.textContent = message;
}

function displayValue(value) {
    return value ? value : "Not available yet";
}

async function loadDisputes() {
    disputeList.replaceChildren();
    showMessage("Loading disputes...", "info");

    try {
        const response = await fetch("/customer/attendance/disputes");
        const contentType = response.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
            throw new Error(
                "The server returned an unexpected response. Please log in again."
            );
        }

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to load disputes.");
        }

        pageMessage.className = "alert d-none";

        if (!data.disputes || data.disputes.length === 0) {
            showMessage("You have no attendance disputes.", "secondary");
            return;
        }

        data.disputes.forEach(dispute => {
            const column = document.createElement("div");
            column.className = "col-12";

            const card = document.createElement("div");
            card.className = "card shadow-sm";

            const body = document.createElement("div");
            body.className = "card-body";

            const title = document.createElement("h5");
            title.className = "card-title";
            title.textContent = `Dispute #${dispute.dispute_id}`;

            const status = document.createElement("span");
            status.className = "badge text-bg-primary mb-3";
            status.textContent = dispute.dispute_status;

            body.append(title, status);

            const fields = [
                ["Attendance ID", dispute.attendance_id],
                ["Attendance date", dispute.attendance_date],
                ["Maid", dispute.maid_name],
                ["Your reason", dispute.customer_reason],
                ["Maid response", dispute.maid_response],
                ["Admin decision", dispute.admin_decision],
                ["Attendance outcome", dispute.attendance_status],
                ["Customer confirmation", dispute.customer_confirmation],
                ["Created at", dispute.created_at],
                ["Resolved at", dispute.resolved_at]
            ];

            fields.forEach(([label, value]) => {
                const paragraph = document.createElement("p");
                const strong = document.createElement("strong");
                strong.textContent = `${label}: `;
                paragraph.append(strong, document.createTextNode(displayValue(value)));
                body.appendChild(paragraph);
            });

            card.appendChild(body);
            column.appendChild(card);
            disputeList.appendChild(column);
        });
    } catch (error) {
        showMessage(error.message, "danger");
    }
}

document.getElementById("refreshButton")
    .addEventListener("click", loadDisputes);

loadDisputes();
</script>

</body>
</html>
