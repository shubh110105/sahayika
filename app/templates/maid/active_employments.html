
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Active Employments | MaidMate</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f6f9;
        }

        .employment-card {
            border: none;
            border-top: 4px solid #198754;
            border-radius: 10px;
        }

        .employment-status {
            display: inline-block;
            padding: 6px 12px;
            background: #d1e7dd;
            color: #146c43;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .detail-label {
            color: #6c757d;
            font-size: 13px;
            margin-bottom: 3px;
        }

        .detail-value {
            font-weight: 500;
            overflow-wrap: anywhere;
        }

        .salary {
            color: #198754;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <span class="navbar-brand">MaidMate</span>
            <span class="text-white">My Active Employments</span>
        </div>
    </nav>

    <main class="container py-4 py-md-5">
        <div class="d-flex justify-content-between align-items-center
                    flex-wrap gap-3 mb-4">
            <div>
                <h2>My Active Employments</h2>
                <p class="text-muted mb-0">
                    View your current employment and household details.
                </p>
            </div>

            <a href="/maid/dashboard" class="btn btn-outline-success">
                Back to Dashboard
            </a>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="text-muted">Total Active Employments</div>
                <div class="fs-2 fw-bold" id="employment-count">0</div>
            </div>
        </div>

        <div id="message" class="alert alert-info" role="status">
            Loading your active employments...
        </div>

        <div id="employment-list" class="row g-4"></div>
    </main>

    <script>
        // Escape database text before inserting it into HTML.
        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, function (char) {
                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };

                return entities[char];
            });
        }

        function formatDate(value) {
            if (!value) return "Not available";

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return escapeHTML(value);
            }

            return date.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric",
                timeZone: "UTC"
            });
        }

        async function loadActiveEmployments() {
            const message = document.getElementById("message");
            const list = document.getElementById("employment-list");
            const count = document.getElementById("employment-count");

            try {
                const response = await fetch("/maid/employments/active", {
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (!response.ok) {
                    throw new Error(
                        "Unable to load employments. HTTP " + response.status
                    );
                }

                const data = await response.json();

                if (!data.success || !Array.isArray(data.employments)) {
                    throw new Error("Invalid response from the server.");
                }

                const employments = data.employments;

                count.textContent = employments.length;
                list.replaceChildren();

                if (employments.length === 0) {
                    message.className = "alert alert-info";
                    message.textContent =
                        "You currently have no active employments.";
                    return;
                }

                message.className = "alert alert-success";
                message.textContent =
                    "Your active employment records loaded successfully.";

                employments.forEach(function (item) {
                    const column = document.createElement("div");
                    column.className = "col-12 col-lg-6";

                    column.innerHTML = `
                        <article class="card employment-card shadow-sm h-100">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between
                                            align-items-center gap-2 mb-4">
                                    <h5 class="mb-0">
                                        Employment #${escapeHTML(item.employment_id)}
                                    </h5>
                                    <span class="employment-status">ACTIVE</span>
                                </div>

                                <div class="row g-3">
                                    <div class="col-sm-6">
                                        <div class="detail-label">Customer</div>
                                        <div class="detail-value">
                                            ${escapeHTML(item.customer_name)}
                                        </div>
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="detail-label">Customer ID</div>
                                        <div class="detail-value">
                                            ${escapeHTML(item.customer_id)}
                                        </div>
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="detail-label">Assignment ID</div>
                                        <div class="detail-value">
                                            ${escapeHTML(item.assignment_id)}
                                        </div>
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="detail-label">Start Date</div>
                                        <div class="detail-value">
                                            ${formatDate(item.start_date)}
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <div class="detail-label">
                                            Monthly Salary
                                        </div>
                                        <div class="salary">
                                            ₹${escapeHTML(item.monthly_salary)}
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <div class="detail-label">
                                            Household Address
                                        </div>
                                        <div class="detail-value">
                                            ${escapeHTML(item.location_address)}
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <div class="detail-label">
                                            City, State and PIN
                                        </div>
                                        <div class="detail-value">
                                            ${escapeHTML(item.city)},
                                            ${escapeHTML(item.state)} -
                                            ${escapeHTML(item.pincode)}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </article>
                    `;

                    list.appendChild(column);
                });
            } catch (error) {
                message.className = "alert alert-danger";
                message.textContent = error.message;
            }
        }

        loadActiveEmployments();
    </script>
</body>
</html>
