<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaidMate - Maid Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-dark bg-success">
    <div class="container">

        <a class="navbar-brand" href="/maid/dashboard">
            MaidMate
        </a>

        <span class="text-white">
            Maid Profile
        </span>

    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        My Profile
                    </h2>

                    <div id="message"></div>

                    <div class="mb-4">

                        <h5>Account Information</h5>

                        <p>
                            <strong>Name:</strong>
                            <span id="fullName">Loading...</span>
                        </p>

                        <p>
                            <strong>Email:</strong>
                            <span id="email">Loading...</span>
                        </p>

                        <p>
                            <strong>Phone:</strong>
                            <span id="phone">Loading...</span>
                        </p>

                        <p>
                            <strong>Verification Status:</strong>
                            <span
                                id="verificationStatus"
                                class="badge bg-secondary"
                            >
                                Loading...
                            </span>
                        </p>

                    </div>

                    <hr>

                    <h5 class="mb-3">
                        Professional Information
                    </h5>

                    <form id="profileForm">

                        <div class="mb-3">

                            <label
                                for="address"
                                class="form-label"
                            >
                                Address
                            </label>

                            <textarea
                                class="form-control"
                                id="address"
                                rows="3"
                                required
                            ></textarea>

                        </div>

                        <div class="mb-3">

                            <label
                                for="city"
                                class="form-label"
                            >
                                City
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="city"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="pincode"
                                class="form-label"
                            >
                                Pincode
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="pincode"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="experienceYears"
                                class="form-label"
                            >
                                Experience (Years)
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="experienceYears"
                                min="0"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="bio"
                                class="form-label"
                            >
                                About Me
                            </label>

                            <textarea
                                class="form-control"
                                id="bio"
                                rows="4"
                                placeholder="Describe your experience and work background..."
                            ></textarea>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >
                            Save Profile
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/maid_profile.js') }}"></script>

</body>

</html>
