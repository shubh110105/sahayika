
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Disputes | MaidMate</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .dispute-card {
            border: 0;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }

        .detail-label {
            color: #6c757d;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .detail-value {
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .reason-box {
            background: #fff8e1;
            border-radius: 8px;
            padding: 15px;
        }

        .response-box {
            background: #eef5ff;
            border-radius: 8px;
            padding: 15px;
        }

        .response-field {
            min-height: 110px;
            resize: vertical;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">MaidMate</span>
            <a href="/maid/dashboard" class="btn btn-light btn-sm">
                Dashboard
            </a>
        </div>
    </nav>

    <main class="container py-4">
        <h1 class="h2">Attendance Disputes</h1>
        <p class="text-muted mb-4">
            Review attendance concerns raised by your customers and submit your response.
        </p>

        <div id="page-message" role="status" class="mb-3"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Your Disputes</h2>
            <button class="btn btn-outline-primary btn-sm" onclick="loadDisputes()">
                Refresh
            </button>
        </div>

        <section id="disputes-list" aria-live="polite">
            <p>Loading disputes...</p>
        </section>
    </main>

    <script>
        const disputesList = document.getElementById("disputes-list");
        const pageMessage = document.getElementById("page-message");

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, function (char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char];
            });
        }

        function formatDate(value) {
            if (!value) return "—";

            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "—";

            return date.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric",
                timeZone: "UTC"
            });
        }

        function formatTime(value) {
            if (!value) return "Not recorded";

            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "—";

            return date.toLocaleTimeString("en-IN", {
                hour: "2-digit",
                minute: "2-digit",
                hour12: true,
                timeZone: "UTC"
            });
        }

        function statusBadge(status) {
            const classes = {
                OPEN: "bg-danger",
                MAID_RESPONDED: "bg-info text-dark",
                UNDER_REVIEW: "bg-warning text-dark",
                RESOLVED: "bg-success",
                REJECTED: "bg-secondary"
            };

            return `<span class="badge ${classes[status] || "bg-secondary"}">
                ${escapeHtml(status || "UNKNOWN")}
            </span>`;
        }

        async function loadDisputes() {
            disputesList.innerHTML = "<p>Loading disputes...</p>";
            pageMessage.textContent = "";
            pageMessage.className = "mb-3";

            try {
                const response = await fetch("/maid/attendance/disputes");
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Could not load disputes.");
                }

                renderDisputes(data.disputes || []);
            } catch (error) {
                disputesList.innerHTML = "";
                pageMessage.className = "alert alert-danger";
                pageMessage.textContent = error.message;
            }
        }

        function renderDisputes(disputes) {
            if (disputes.length === 0) {
                disputesList.innerHTML = `
                    <div class="alert alert-info">
                        You have no attendance disputes.
                    </div>
                `;
                return;
            }

            disputesList.innerHTML = disputes.map(function (dispute) {
                const canRespond =
                    dispute.dispute_status === "OPEN" &&
                    !dispute.maid_response;

                return `
                    <article class="card dispute-card">
                        <div class="card-body p-4">
                            <div class="d-flex flex-wrap justify-content-between
                                        align-items-center gap-2 mb-3">
                                <h2 class="h5 mb-0">
                                    Dispute #${Number(dispute.dispute_id)}
                                </h2>
                                ${statusBadge(dispute.dispute_status)}
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <div class="detail-label">Customer</div>
                                    <div class="detail-value">
                                        ${escapeHtml(dispute.customer_name)}
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="detail-label">Attendance date</div>
                                    <div class="detail-value">
                                        ${escapeHtml(formatDate(dispute.attendance_date))}
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="detail-label">Attendance ID</div>
                                    <div class="detail-value">
                                        ${Number(dispute.attendance_id)}
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="detail-label">Check-in</div>
                                    <div class="detail-value">
                                        ${escapeHtml(formatTime(dispute.check_in))}
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="detail-label">Check-out</div>
                                    <div class="detail-value">
                                        ${escapeHtml(formatTime(dispute.check_out))}
                                    </div>
                                </div>
                            </div>

                            <div class="reason-box mb-3">
                                <h3 class="h6">Customer's Reason</h3>
                                <div class="detail-value">
                                    ${escapeHtml(dispute.customer_reason)}
                                </div>
                            </div>

                            <div class="response-box mb-3">
                                <h3 class="h6">Your Response</h3>
                                <div class="detail-value">
                                    ${escapeHtml(dispute.maid_response || "No response submitted yet.")}
                                </div>
                            </div>

                            ${canRespond ? `
                                <form onsubmit="submitResponse(event, ${Number(dispute.dispute_id)}, this)">
                                    <label
                                        class="form-label"
                                        for="response-${Number(dispute.dispute_id)}">
                                        Explain your side
                                    </label>

                                    <textarea
                                        id="response-${Number(dispute.dispute_id)}"
                                        name="response"
                                        class="form-control response-field"
                                        maxlength="2000"
                                        required
                                        placeholder="Enter your response to the customer's concern."></textarea>

                                    <button
                                        type="submit"
                                        class="btn btn-primary mt-3">
                                        Submit Response
                                    </button>
                                </form>
                            ` : ""}
                        </div>
                    </article>
                `;
            }).join("");
        }

        async function submitResponse(event, disputeId, form) {
            event.preventDefault();

            const textarea = form.elements.response;
            const responseText = textarea.value.trim();

            if (!responseText) {
                pageMessage.className = "alert alert-warning";
                pageMessage.textContent = "Please enter a response.";
                textarea.focus();
                return;
            }

            const button = form.querySelector('button[type="submit"]');
            button.disabled = true;
            pageMessage.textContent = "";
            pageMessage.className = "mb-3";

            try {
                const response = await fetch(
                    `/maid/attendance/disputes/${disputeId}/respond`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ response: responseText })
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Could not submit response.");
                }

                pageMessage.className = "alert alert-success";
                pageMessage.textContent = data.message;

                await loadDisputes();
            } catch (error) {
                pageMessage.className = "alert alert-danger";
                pageMessage.textContent = error.message;
                button.disabled = false;
            }
        }

        loadDisputes();
    </script>
</body>
</html>
