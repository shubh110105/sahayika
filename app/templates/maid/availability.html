
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Availability | MaidMate</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>My Availability</h2>
            <p class="text-muted mb-0">
                Manage the days and hours when you can work.
            </p>
        </div>
        <a href="/maid/dashboard" class="btn btn-outline-secondary">
            Dashboard
        </a>
    </div>

    <div id="message" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header fw-semibold">Add an availability slot</div>
        <div class="card-body">
            <form id="availabilityForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="day" class="form-label">Day</label>
                        <select id="day" class="form-select" required>
                            <option value="">Select a day</option>
                            <option value="1">Monday</option>
                            <option value="2">Tuesday</option>
                            <option value="3">Wednesday</option>
                            <option value="4">Thursday</option>
                            <option value="5">Friday</option>
                            <option value="6">Saturday</option>
                            <option value="7">Sunday</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="startTime" class="form-label">
                            Start time
                        </label>
                        <input
                            type="time"
                            id="startTime"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="col-md-3">
                        <label for="endTime" class="form-label">
                            End time
                        </label>
                        <input
                            type="time"
                            id="endTime"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            Add Slot
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header fw-semibold">My weekly schedule</div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Day</th>
                            <th>Start</th>
                            <th>End</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="availabilityRows">
                        <tr>
                            <td colspan="5" class="text-center text-muted">
                                Loading availability...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const dayNames = {
    1: "Monday",
    2: "Tuesday",
    3: "Wednesday",
    4: "Thursday",
    5: "Friday",
    6: "Saturday",
    7: "Sunday"
};

const messageBox = document.getElementById("message");
const rows = document.getElementById("availabilityRows");

function showMessage(message, success) {
    messageBox.textContent = message;
    messageBox.className = "alert " +
        (success ? "alert-success" : "alert-danger");
}

async function loadAvailability() {
    rows.replaceChildren();

    try {
        const response = await fetch("/maid/availability");
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to load availability.");
        }

        if (!data.availability.length) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = 5;
            td.className = "text-center text-muted";
            td.textContent = "No availability slots added yet.";
            tr.appendChild(td);
            rows.appendChild(tr);
            return;
        }

        data.availability.forEach(slot => {
            const tr = document.createElement("tr");

            const values = [
                dayNames[slot.day_of_week],
                String(slot.start_time).slice(0, 5),
                String(slot.end_time).slice(0, 5),
                slot.status
            ];

            values.forEach(value => {
                const td = document.createElement("td");
                td.textContent = value;
                tr.appendChild(td);
            });

            const actionCell = document.createElement("td");
            const button = document.createElement("button");
            button.className = "btn btn-sm " +
                (slot.status === "ACTIVE"
                    ? "btn-outline-danger"
                    : "btn-outline-success");

            button.textContent = slot.status === "ACTIVE"
                ? "Deactivate"
                : "Activate";

            button.addEventListener("click", async () => {
                button.disabled = true;

                try {
                    const newStatus = slot.status === "ACTIVE"
                        ? "INACTIVE"
                        : "ACTIVE";

                    const result = await fetch(
                        `/maid/availability/${slot.availability_id}/status`,
                        {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({status: newStatus})
                        }
                    );

                    const resultData = await result.json();

                    if (!result.ok || !resultData.success) {
                        throw new Error(
                            resultData.message || "Update failed."
                        );
                    }

                    showMessage(resultData.message, true);
                    await loadAvailability();
                } catch (error) {
                    showMessage(error.message, false);
                    button.disabled = false;
                }
            });

            actionCell.appendChild(button);
            tr.appendChild(actionCell);
            rows.appendChild(tr);
        });
    } catch (error) {
        rows.replaceChildren();
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 5;
        td.className = "text-danger";
        td.textContent = error.message;
        tr.appendChild(td);
        rows.appendChild(tr);
    }
}

document.getElementById("availabilityForm").addEventListener(
    "submit",
    async event => {
        event.preventDefault();

        const day = Number(document.getElementById("day").value);
        const startTime = document.getElementById("startTime").value;
        const endTime = document.getElementById("endTime").value;

        if (!day || !startTime || !endTime || startTime >= endTime) {
            showMessage("Select a day and a valid time range.", false);
            return;
        }

        try {
            const response = await fetch("/maid/availability", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    day_of_week: day,
                    start_time: startTime,
                    end_time: endTime
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Unable to add slot.");
            }

            showMessage(data.message, true);
            document.getElementById("availabilityForm").reset();
            await loadAvailability();
        } catch (error) {
            showMessage(error.message, false);
        }
    }
);

loadAvailability();
</script>

</body>
</html>
