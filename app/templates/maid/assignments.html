
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Assignments | MaidMate</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>My Assignments</h2>
            <p class="text-muted mb-0">
                Review household requests assigned to you.
            </p>
        </div>
        <a href="/maid/dashboard" class="btn btn-outline-secondary">
            Dashboard
        </a>
    </div>

    <div id="message" class="alert d-none" role="alert"></div>
    <div id="assignments" class="row g-3">
        <div class="col-12 text-muted">Loading assignments...</div>
    </div>
</div>

<script>
const container = document.getElementById("assignments");
const messageBox = document.getElementById("message");

function showMessage(message, success) {
    messageBox.textContent = message;
    messageBox.className =
        "alert " + (success ? "alert-success" : "alert-danger");
}

function addDetail(cardBody, label, value) {
    const p = document.createElement("p");
    const strong = document.createElement("strong");
    strong.textContent = label + ": ";
    p.appendChild(strong);
    p.appendChild(document.createTextNode(
        value === null || value === undefined || value === ""
            ? "Not provided"
            : String(value)
    ));
    cardBody.appendChild(p);
}

async function loadAssignments() {
    container.replaceChildren();

    try {
        const response = await fetch("/maid/assignments");
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to load assignments.");
        }

        if (!data.assignments.length) {
            const empty = document.createElement("div");
            empty.className = "col-12";
            empty.textContent = "You have no assignments at the moment.";
            container.appendChild(empty);
            return;
        }

        data.assignments.forEach(assignment => {
            const column = document.createElement("div");
            column.className = "col-12 col-lg-6";

            const card = document.createElement("div");
            card.className = "card shadow-sm h-100";

            const body = document.createElement("div");
            body.className = "card-body";

            const heading = document.createElement("h5");
            heading.className = "card-title";
            heading.textContent =
                "Assignment #" + assignment.assignment_id;
            body.appendChild(heading);

            addDetail(body, "Requirement", assignment.requirement_id);
            addDetail(body, "Location", [
                assignment.location_address,
                assignment.city,
                assignment.state,
                assignment.pincode
            ].filter(Boolean).join(", "));
            addDetail(body, "Services", assignment.services);
            addDetail(
                body,
                "Estimated monthly salary",
                assignment.estimated_monthly_salary === null
                    ? "Not available"
                    : "₹" + Number(
                        assignment.estimated_monthly_salary
                    ).toLocaleString("en-IN")
            );
            addDetail(
                body,
                "Additional requirements",
                assignment.additional_requirements
            );
            addDetail(body, "Status", assignment.assignment_status);

            if (assignment.assignment_status === "PENDING_MAID_RESPONSE") {
                const actions = document.createElement("div");
                actions.className = "d-flex gap-2 mt-3";

                ["ACCEPT", "REJECT"].forEach(decision => {
                    const button = document.createElement("button");
                    button.className = decision === "ACCEPT"
                        ? "btn btn-success"
                        : "btn btn-outline-danger";
                    button.textContent = decision === "ACCEPT"
                        ? "Accept Assignment"
                        : "Reject Assignment";

                    button.addEventListener("click", async () => {
                        if (
                            decision === "REJECT" &&
                            !confirm("Are you sure you want to reject this assignment?")
                        ) {
                            return;
                        }

                        button.disabled = true;

                        try {
                            const result = await fetch(
                                `/maid/assignments/${assignment.assignment_id}/response`,
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type": "application/json"
                                    },
                                    body: JSON.stringify({decision})
                                }
                            );

                            const resultData = await result.json();

                            if (!result.ok || !resultData.success) {
                                throw new Error(
                                    resultData.message ||
                                    "Unable to save your response."
                                );
                            }

                            showMessage(resultData.message, true);
                            await loadAssignments();
                        } catch (error) {
                            showMessage(error.message, false);
                            button.disabled = false;
                        }
                    });

                    actions.appendChild(button);
                });

                body.appendChild(actions);
            }

            card.appendChild(body);
            column.appendChild(card);
            container.appendChild(column);
        });
    } catch (error) {
        container.replaceChildren();
        const errorText = document.createElement("p");
        errorText.className = "text-danger";
        errorText.textContent = error.message;
        container.appendChild(errorText);
    }
}

loadAssignments();
</script>

</body>
</html>
