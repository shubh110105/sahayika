
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaidMate - Maid Verification</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard.admin_dashboard') }}">
            MaidMate
        </a>
        <span class="text-white">Maid Verification</span>
    </div>
</nav>

<main class="container py-4">
    <a href="{{ url_for('dashboard.admin_dashboard') }}"
       class="btn btn-outline-secondary btn-sm mb-3">
        Back to Dashboard
    </a>

    <h2>Pending Maid Verifications</h2>
    <p class="text-muted">
        Review each submitted verification request before making a decision.
    </p>

    <div id="message" class="alert alert-info" aria-live="polite">
        Loading verification requests...
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Maid ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Location</th>
                    <th>Experience</th>
                    <th>Bio</th>
                    <th>Submitted</th>
                    <th>Decision</th>
                </tr>
            </thead>
            <tbody id="verificationRows"></tbody>
        </table>
    </div>
</main>

<script>
const message = document.getElementById("message");
const verificationRows = document.getElementById("verificationRows");

async function loadVerifications() {
    try {
        const response = await fetch("/admin/verifications");
        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.message || "Unable to load verification requests."
            );
        }

        verificationRows.replaceChildren();

        if (!result.verifications.length) {
            message.className = "alert alert-info";
            message.textContent = "No pending verification requests.";
            return;
        }

        message.className = "alert alert-success";
        message.textContent =
            `${result.verifications.length} pending request(s) found.`;

        result.verifications.forEach(function (item) {
            const row = document.createElement("tr");

            const location = [
                item.city,
                item.pincode
            ].filter(Boolean).join(", ");

            const values = [
                item.maid_id,
                item.full_name,
                item.email,
                item.phone,
                location,
                item.experience_years == null
                    ? ""
                    : `${item.experience_years} years`,
                item.bio,
                item.submitted_at
            ];

            values.forEach(function (value) {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            const actionCell = document.createElement("td");

            const approveButton = document.createElement("button");
            approveButton.className = "btn btn-success btn-sm me-1 mb-1";
            approveButton.textContent = "Verify";

            const rejectButton = document.createElement("button");
            rejectButton.className = "btn btn-danger btn-sm mb-1";
            rejectButton.textContent = "Reject";

            approveButton.addEventListener("click", function () {
                submitDecision(item.verification_id, "VERIFIED");
            });

            rejectButton.addEventListener("click", function () {
                const remarks = window.prompt(
                    "Enter the reason for rejection:"
                );

                if (remarks === null) return;

                if (!remarks.trim()) {
                    message.className = "alert alert-warning";
                    message.textContent =
                        "A rejection reason is required.";
                    return;
                }

                submitDecision(
                    item.verification_id,
                    "REJECTED",
                    remarks.trim()
                );
            });

            actionCell.append(approveButton, rejectButton);
            row.appendChild(actionCell);
            verificationRows.appendChild(row);
        });
    } catch (error) {
        message.className = "alert alert-danger";
        message.textContent = error.message;
    }
}

async function submitDecision(verificationId, decision, remarks = "") {
    if (!window.confirm(`Confirm decision: ${decision}?`)) return;

    try {
        const response = await fetch(
            `/admin/verifications/${verificationId}/decision`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ decision, remarks })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.message || "Unable to save the decision."
            );
        }

        message.className = "alert alert-success";
        message.textContent = result.message;

        await loadVerifications();
    } catch (error) {
        message.className = "alert alert-danger";
        message.textContent = error.message;
    }
}

loadVerifications();
</script>
</body>
</html>
