
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Disputes | MaidMate Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .dispute-card {
            background: white;
            border: 0;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }

        .detail-label {
            color: #6c757d;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .detail-value {
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .reason-box {
            background: #fff8e1;
            border-radius: 8px;
            padding: 14px;
        }

        .response-box {
            background: #eef5ff;
            border-radius: 8px;
            padding: 14px;
        }

        .decision-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 14px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">MaidMate Admin</span>
            <a href="/admin/dashboard" class="btn btn-light btn-sm">
                Dashboard
            </a>
        </div>
    </nav>

    <main class="container py-4">
        <header class="page-header">
            <h1 class="h2">Attendance Disputes</h1>
            <p class="text-muted">
                Review customer complaints about attendance records.
            </p>
        </header>

        <div id="page-message" class="mb-3" role="status"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Dispute Records</h2>
            <button class="btn btn-outline-primary btn-sm" onclick="loadDisputes()">
                Refresh
            </button>
        </div>

        <section id="disputes-list" aria-live="polite">
            <p>Loading disputes...</p>
        </section>
    </main>

    <script>
        const disputesList = document.getElementById("disputes-list");
        const pageMessage = document.getElementById("page-message");

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, function (char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char];
            });
        }

        function formatDate(value) {
            if (!value) return "—";

            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "—";

            return date.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric",
                timeZone: "UTC"
            });
        }

        function formatTime(value) {
            if (!value) return "Not recorded";

            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "—";

            return date.toLocaleTimeString("en-IN", {
                hour: "2-digit",
                minute: "2-digit",
                hour12: true,
                timeZone: "UTC"
            });
        }

        function statusBadge(status) {
            const classes = {
                OPEN: "bg-danger",
                MAID_RESPONDED: "bg-info text-dark",
                UNDER_REVIEW: "bg-warning text-dark",
                RESOLVED: "bg-success",
                REJECTED: "bg-secondary"
            };

            const badgeClass = classes[status] || "bg-secondary";

            return `<span class="badge ${badgeClass}">
                ${escapeHtml(status || "UNKNOWN")}
            </span>`;
        }

        async function loadDisputes() {
            disputesList.innerHTML = "<p>Loading disputes...</p>";
            pageMessage.textContent = "";

            try {
                const response = await fetch("/admin/attendance/disputes");
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Could not load disputes.");
                }

                renderDisputes(data.disputes || []);
            } catch (error) {
                disputesList.innerHTML = "";
                pageMessage.className = "alert alert-danger";
                pageMessage.textContent = error.message;
            }
        }

        function renderDisputes(disputes) {
            if (disputes.length === 0) {
                disputesList.innerHTML = `
                    <div class="alert alert-info">
                        No attendance disputes have been submitted.
                    </div>
                `;
                return;
            }

            disputesList.innerHTML = disputes.map(function (dispute) {
                return `
                    <article class="card dispute-card">
                        <div class="card-body p-4">
                            <div class="d-flex flex-wrap justify-content-between
                                        align-items-center gap-2 mb-3">
                                <h3 class="h5 mb-0">
                                    Dispute #${Number(dispute.dispute_id)}
                                </h3>
                                ${statusBadge(dispute.dispute_status)}
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <div class="detail-label">Customer</div>
                                    <div class="detail-value">
                                        ${escapeHtml(dispute.customer_name)}
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="detail-label">Maid</div>
                                    <div class="detail-value">
                                        ${escapeHtml(dispute.maid_name)}
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="detail-label">Attendance date</div>
                                    <div class="detail-value">
                                        ${escapeHtml(formatDate(dispute.attendance_date))}
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="detail-label">Check-in</div>
                                    <div class="detail-value">
                                        ${escapeHtml(formatTime(dispute.check_in))}
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="detail-label">Check-out</div>
                                    <div class="detail-value">
                                        ${escapeHtml(formatTime(dispute.check_out))}
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="detail-label">Attendance status</div>
                                    <div class="detail-value">
                                        ${escapeHtml(dispute.attendance_status)}
                                    </div>
                                </div>
                            </div>

                            <div class="reason-box mb-3">
                                <h4 class="h6">Customer's Reason</h4>
                                <div class="detail-value">
                                    ${escapeHtml(dispute.customer_reason)}
                                </div>
                            </div>

                            <div class="response-box mb-3">
                                <h4 class="h6">Maid's Response</h4>
                                <div class="detail-value">
                                    ${escapeHtml(dispute.maid_response || "No response submitted yet.")}
                                </div>
                            </div>

                            <div class="decision-box">
                                <h4 class="h6">Admin Decision</h4>
                                <div class="detail-value">
                                    ${escapeHtml(dispute.admin_decision || "No decision recorded yet.")}
                                </div>
                                ${dispute.resolved_at ? `
                                    <small class="text-muted">
                                        Resolved: ${escapeHtml(formatDate(dispute.resolved_at))}
                                    </small>
                                ` : ""}
                            </div>
                        </div>
                    </article>
                `;
            }).join("");
        }

        loadDisputes();
    </script>
</body>
</html>
