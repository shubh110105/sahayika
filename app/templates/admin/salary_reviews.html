
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaidMate - Salary Review Requests</title>

    <!-- Bootstrap provides the page layout, table, and button styling. -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Navigation bar with a link back to the Admin dashboard. -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand"
               href="{{ url_for('dashboard.admin_dashboard') }}">
                MaidMate
            </a>
            <span class="text-white">Salary Review Requests</span>
        </div>
    </nav>

    <div class="container py-5">

        <!-- Page heading and dashboard navigation. -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Salary Review Requests</h2>

            <a href="{{ url_for('dashboard.admin_dashboard') }}"
               class="btn btn-outline-secondary">
                Back to Dashboard
            </a>
        </div>

        <!-- JavaScript updates this message with loading, success, or error information. -->
        <div id="reviewMessage"
             class="alert alert-info"
             role="status"
             aria-live="polite">
            Loading salary review requests...
        </div>

        <!-- The table displays requests fetched from the Admin API. -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped bg-white align-middle">

                <thead class="table-dark">
                    <tr>
                        <th>Requirement ID</th>
                        <th>Location</th>
                        <th>Estimated Monthly Salary</th>
                        <th>Requested On</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <!-- JavaScript inserts one row per pending salary review. -->
                <tbody id="salaryReviewTableBody">
                </tbody>

            </table>
        </div>

    </div>

    <!-- Loads the JavaScript that fetches requests and handles Admin decisions. -->
    <script src="{{ url_for('static', filename='js/admin_salary_reviews.js') }}"></script>

</body>
</html>
