
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaidMate - Maid Shortlist</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard.admin_dashboard') }}">
            MaidMate
        </a>
        <span class="text-white">Maid Shortlist</span>
    </div>
</nav>

<main class="container py-4">
    <a href="{{ url_for('dashboard.admin_dashboard') }}"
       class="btn btn-outline-secondary btn-sm mb-3">
        Back to Dashboard
    </a>

    <h2>Eligible Maid Candidates</h2>
    <p class="text-muted">
        Requirement #{{ requirement_id }}.
        Review the eligible candidates and manually select a maid.
    </p>

    <div id="message" class="alert alert-info" aria-live="polite">
        Loading candidates...
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Maid</th>
                    <th>Experience</th>
                    <th>Location</th>
                    <th>Matched Services</th>
                    <th>Score</th>
                    <th>Match Reasons</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="candidateRows"></tbody>
        </table>
    </div>
</main>

<script type="application/json" id="requirement-id">{{ requirement_id | tojson }}</script>
<script>
const requirementId = JSON.parse(
    document.getElementById("requirement-id").textContent
);
const message = document.getElementById("message");
const candidateRows = document.getElementById("candidateRows");

async function loadCandidates() {
    try {
        const response = await fetch(
            `/admin/requirements/${requirementId}/shortlist`
        );
        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Could not load candidates.");
        }

        candidateRows.replaceChildren();

        if (!result.candidates.length) {
            message.className = "alert alert-warning";
            message.textContent = result.message || "No eligible candidates found.";
            return;
        }

        message.className = "alert alert-success";
        message.textContent =
            `${result.candidates.length} eligible candidate(s) found.`;

        result.candidates.forEach(function (maid) {
            const row = document.createElement("tr");

            const location = [
                maid.city,
                maid.pincode
            ].filter(Boolean).join(", ");

            const values = [
                maid.full_name,
                `${maid.experience_years} years`,
                location || "Not available",
                maid.matched_service_count,
                maid.shortlist_score,
                (maid.match_reasons || []).join("; ")
            ];

            values.forEach(function (value) {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            const actionCell = document.createElement("td");
            const assignButton = document.createElement("button");

            assignButton.type = "button";
            assignButton.className = "btn btn-primary btn-sm";
            assignButton.textContent = "Assign Maid";

            assignButton.addEventListener("click", async function () {
                const confirmed = window.confirm(
                    `Assign ${maid.full_name} to Requirement #${requirementId}?`
                );

                if (!confirmed) return;

                assignButton.disabled = true;
                assignButton.textContent = "Assigning...";

                try {
                    const assignResponse = await fetch(
                        `/admin/requirements/${requirementId}/assign`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                maid_id: maid.maid_id
                            })
                        }
                    );

                    const assignResult = await assignResponse.json();

                    if (!assignResponse.ok || !assignResult.success) {
                        throw new Error(
                            assignResult.message || "Assignment failed."
                        );
                    }

                    message.className = "alert alert-success";
                    message.textContent =
                        `${assignResult.message} Assignment ID: ` +
                        assignResult.assignment_id;

                    assignButton.textContent = "Assigned";
                    row.classList.add("table-success");

                    // Prevent another assignment from this page.
                    document.querySelectorAll(".btn-primary").forEach(
                        function (button) {
                            button.disabled = true;
                        }
                    );
                } catch (error) {
                    message.className = "alert alert-danger";
                    message.textContent = error.message;
                    assignButton.disabled = false;
                    assignButton.textContent = "Assign Maid";
                }
            });

            actionCell.appendChild(assignButton);
            row.appendChild(actionCell);
            candidateRows.appendChild(row);
        });
    } catch (error) {
        message.className = "alert alert-danger";
        message.textContent = error.message;
    }
}

loadCandidates();
</script>
</body>
</html>
