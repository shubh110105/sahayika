<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaidMate - Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">MaidMate</span>
        <span class="text-white">Admin Dashboard</span>
    </div>
</nav>

<div class="container mt-5">

    <h2>Admin Dashboard</h2>

    <p class="text-muted">
        Manage verification, requirements, assignments,
        complaints, salaries and platform analytics.
    </p>

    <div class="row mt-4">

        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5>Maid Verification</h5>
                    <p>Review and manage maid verification.</p>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5>Assignments</h5>
                    <p>Review matching and maid assignments.</p>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5>Analytics</h5>
                    <p>View platform performance and statistics.</p>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
